<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Kami</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="slideContact.js"></script>
    <style>
        /* Kita bisa jaga-jaga agar transisi lebih mulus */
        #slider-container {
            transition: transform 0.5s ease-in-out;
        }
        #contact-description {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>

<body class="font-sans">
    <!-- Sidebar Kiri (dari kode Anda) -->
    <aside class="bg-green-400 fixed top-0 left-0 w-20 h-screen hidden md:flex">
        <!-- Ikon-ikon navigasi bisa ditambahkan di sini -->
    </aside>

    <!-- Konten Utama -->
    <section class="max-h-screen md:flex md:ml-20">
        
        <!-- KOLOM KIRI (YANG DIMODIFIKASI) -->
        <div class="hidden h-screen md:w-1/2 bg-gradient-to-r from-lime-300 to-green-600 md:flex flex-col justify-center py-12 px-8">
            <!-- Kartu Putih -->
            <div class="bg-white rounded-2xl w-full h-full shadow-2xl flex flex-col">
                
                <!-- BAGIAN ATAS: SLIDER INTERAKTIF -->
                <div class="mb-2 h-1/2 rounded-t-2xl p-6 flex flex-col justify-center items-center relative" style="background-color: #fdf2f8;"> <!-- Warna pink muda -->
                    
                    <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">Tentukan Pilihan Anda</h3>

                    <!-- Wrapper Carousel -->
                    <div class="w-full max-w-xs relative overflow-hidden"> <!-- DIUBAH: ditambahkan 'overflow-hidden' -->
                        <!-- Kontainer Slide (yang akan digeser oleh JS) -->
                        <div id="slider-container" class="flex">
                            
                            <!-- Slide 1: WhatsApp -->
                            <div class="carousel-slide w-full flex-shrink-0 flex justify-center">
                                <a href="https://wa.me/628123456789" target="_blank" rel="noopener noreferrer" class="block w-48 h-48 bg-white rounded-xl shadow-lg p-6 flex flex-col items-center justify-center transition-transform hover:scale-105" aria-label="Hubungi via WhatsApp">
                                    <svg class="w-16 h-16 text-green-500" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.05 4.91A9.816 9.816 0 0 0 12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.69-1.05-5.14-2.91-6.96zM12.04 20.15h-.01c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.06 8.06 0 0 1-1.23-4.38c0-4.47 3.64-8.1 8.1-8.1s8.1 3.63 8.1 8.1c0 4.47-3.64 8.1-8.1 8.1zm4.49-5.93c-.26-.13-1.56-.77-1.8-0.86-.24-.09-.42-.13-.59.13-.17.26-.68.86-.84 1.03-.16.17-.32.19-.59.06-.27-.13-1.14-.42-2.17-1.34-.8-.73-1.34-1.64-1.5-1.92-.16-.28-.02-.43.12-.56.12-.12.26-.31.39-.47.13-.16.17-.26.26-.44.09-.17.04-.31-.02-.44s-.59-1.42-.81-1.95c-.21-.52-.43-.45-.59-.46-.16 0-.33-.01-.5-.01s-.42.06-.64.31c-.22.24-.86.84-.86 2.04 0 1.2.88 2.36 1 2.53.12.17 1.73 2.63 4.2 3.68 0.59.25 1.05.4 1.41.51.59.19 1.13.16 1.56.1.48-.07 1.56-.64 1.78-1.26.22-.62.22-1.16.16-1.26-.06-.1-.24-.16-.5-.29z"></path></svg>
                                    <span class="mt-4 text-xl font-semibold text-gray-700">WhatsApp</span>
                                </a>
                            </div>

                            <!-- Slide 2: Email -->
                            <div class="carousel-slide w-full flex-shrink-0 flex justify-center">
                                <a href="mailto:dukungan@emailanda.com" target="_blank" rel="noopener noreferrer" class="block w-48 h-48 bg-white rounded-xl shadow-lg p-6 flex flex-col items-center justify-center transition-transform hover:scale-105" aria-label="Kirim Email">
                                    <svg class="w-16 h-16 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                    <span class="mt-4 text-xl font-semibold text-gray-700">Email</span>
                                </a>
                            </div>

                            <!-- Slide 3: Instagram -->
                            <div class="carousel-slide w-full flex-shrink-0 flex justify-center">
                                <a href="https://instagram.com/usernameanda" target="_blank" rel="noopener noreferrer" class="block w-48 h-48 bg-white rounded-xl shadow-lg p-6 flex flex-col items-center justify-center transition-transform hover:scale-105" aria-label="Kunjungi Instagram">
                                    <svg class="w-16 h-16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><defs><radialGradient id="ig-grad" r="150%" cx="30%" cy="107%"><stop stop-color="#fdf497" offset="0"></stop><stop stop-color="#fdf497" offset="0.05"></stop><stop stop-color="#fd5949" offset="0.45"></stop><stop stop-color="#d6249f" offset="0.6"></stop><stop stop-color="#285AEB" offset="0.9"></stop></radialGradient></defs><path fill="url(#ig-grad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.07 1.646.07 4.85s-.012 3.584-.07 4.85c-.148 3.227-1.667 4.771-4.919 4.919-1.266.058-1.646.07-4.85.07-3.204 0-3.584-.012-4.85-.07-3.252-.148-4.771-1.691-4.919-4.919-.058-1.265-.07-1.646-.07-4.85s.012-3.584.07-4.85c.148-3.227 1.667-4.771 4.919-4.919C8.456 2.175 8.836 2.163 12 2.163m0-2.163C8.74 0 8.333.012 7.053.072 2.695.272.273 2.69.073 7.052.012 8.333 0 8.74 0 12s.012 3.667.072 4.948c.2 4.358 2.618 6.78 6.98 6.98C8.333 23.988 8.74 24 12 24s3.667-.012 4.948-.072c4.354-.2 6.782-2.618 6.979-6.98.06-1.281.073-1.687.073-4.948s-.013-3.667-.072-4.948C23.728 2.69 21.31 0.273 16.948 0.072 15.667 0.012 15.26 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.88 1.44 1.44 0 000-2.88z"></path></svg>
                                    <span class="mt-4 text-xl font-semibold text-gray-700">Instagram</span>
                                </a>
                            </div>

                            <!-- Slide 4: Lokasi -->
                            <div class="carousel-slide w-full flex-shrink-0 flex justify-center">
                                <a href="https://maps.app.goo.gl/abcdef123456" target="_blank" rel="noopener noreferrer" class="block w-48 h-48 bg-white rounded-xl shadow-lg p-6 flex flex-col items-center justify-center transition-transform hover:scale-105" aria-label="Lihat Lokasi Kami">
                                    <svg class="w-16 h-16 text-red-600" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"></path></svg>
                                    <span class="mt-4 text-xl font-semibold text-gray-700">Lokasi</span>
                                </a>
                            </div>

                        </div>
                        
                        <!-- Tombol Navigasi -->
                        <button id="prev-slide" class="absolute top-1/2 left-2 transform -translate-y-1/2 bg-white/60 rounded-full p-2 hover:bg-white shadow-md transition-colors" aria-label="Slide sebelumnya">
                            <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button id="next-slide" class="absolute top-1/2 right-2 transform -translate-y-1/2 bg-white/60 rounded-full p-2 hover:bg-white shadow-md transition-colors" aria-label="Slide berikutnya">
                            <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>

                    <!-- Indikator Titik -->
                    <div id="slider-indicators" class="flex space-x-2 mt-6">
                        <!-- Titik-titik akan dibuat oleh JavaScript -->
                    </div>
                </div>
                
                <!-- BAGIAN BAWAH: DESKRIPSI (YANG BERUBAH) -->
                <div class="p-6 text-center h-1/2 flex items-center justify-center">
                    <p id="contact-description" class="text-gray-600 text-lg leading-relaxed">
                        <!-- Teks deskripsi akan diisi oleh JavaScript -->
                    </p>
                </div>
            </div>
        </div>
        
        <!-- KOLOM KANAN (FORMULIR KONTAK DARI KODE ANDA) -->
        <div class="h-screen text-white bg-gradient-to-r from-green-600 to-lime-300 md:w-1/2 p-8 flex flex-col justify-center">
            <div class="items-center justify-center text-left max-w-lg mx-auto w-full">
                <h1 class="text-3xl font-bold mb-4">Kirim langsung kepada Kami</h1>
                <p class="mb-8 text-lg">Punya pertanyaan atau masukan? Kirimkan pesan Anda.</p>

                <form class="space-y-6 text-black">

                    <input class="w-full rounded-lg border-2 border-lime-200 p-3 text-base focus:outline-none focus:border-red-400" type="text" placeholder="Nama Anda"
                        required>
                    <input class="w-full rounded-lg border-2 border-lime-200 p-3 text-base focus:outline-none focus:border-red-400" type="email" placeholder="Email Anda" required>
                    <textarea class="w-full rounded-lg border-2 border-lime-200 p-3 text-base focus:outline-none focus:border-red-400" rows="5" placeholder="Pesan Anda"
                        required></textarea>
                </form>
                <button class="bg-red-700 rounded-lg w-full p-3 my-6 text-lg font-bold hover:bg-red-600 transition-colors">
                    Kirim Pesan
                </button>

            </div>
        </div>
    </section>

    

</body>
</html>
